name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc libsdl2-dev libsqlite3-dev python3 python3-pip
        pip3 install -r requirements.txt || true

    - name: Compile Simulation
      run: |
        gcc -fopenmp simulation.c -o simulation `sdl2-config --cflags --libs` -lsqlite3 -O2 -lm

    - name: Run Simulation and Generate Dataset
      run: ./simulation --table smoke_test

    - name: Run Python Training Script
      run: python3 model_training.py --table_name smoke_test --epochs 1 --limit 10

    - name: Run Benchmark Script
      run: python3 benchmark.py
